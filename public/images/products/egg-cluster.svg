<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="clusterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#174BFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eggGrad1" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="eggHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#071426"/>
  <circle cx="200" cy="140" r="130" fill="url(#clusterGlow)"/>
  
  <!-- Shadows -->
  <ellipse cx="200" cy="225" rx="130" ry="20" fill="#040b15" opacity="0.8"/>
  
  <!-- Eggs Arrangement -->
  <!-- Back Layer -->
  <ellipse cx="140" cy="140" rx="30" ry="42" fill="url(#eggGrad1)" transform="rotate(-15 140 140)"/>
  <ellipse cx="260" cy="140" rx="30" ry="42" fill="url(#eggGrad1)" transform="rotate(15 260 140)"/>
  
  <!-- Mid Layer -->
  <ellipse cx="170" cy="160" rx="32" ry="44" fill="url(#eggGrad1)" transform="rotate(-8 170 160)"/>
  <ellipse cx="230" cy="160" rx="32" ry="44" fill="url(#eggGrad1)" transform="rotate(8 230 160)"/>
  
  <!-- Hero Center Egg -->
  <ellipse cx="200" cy="145" rx="38" ry="52" fill="url(#eggGrad1)"/>
  <path d="M185 115 Q195 105 205 115" stroke="url(#eggHighlight)" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Star Quality Accent -->
  <circle cx="340" cy="50" r="24" fill="#174BFF" opacity="0.9"/>
  <text x="340" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">GRADE A</text>

  <text x="200" y="275" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#AAB7CC" text-anchor="middle" letter-spacing="1.5">SELECT TABLE WHITE EGGS</text>
</svg>
